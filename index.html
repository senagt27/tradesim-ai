<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TradeSim AI">
<title>TradeSim AI</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F1F5F9;color:#0F172A;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#app{height:100%;display:flex;flex-direction:column}
/* NAV */
.nav{height:54px;background:#fff;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;z-index:10}
.logo{display:flex;align-items:center;gap:8px}
.logo-box{width:28px;height:28px;background:#0F172A;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.logo-txt{font-weight:700;font-size:15px}
.logo-txt span{font-weight:300;color:#64748B}
.nav-r{display:flex;align-items:center;gap:6px}
.ldot{width:7px;height:7px;border-radius:50%;background:#22C55E;animation:pulse 2s infinite}
.lbl{font-size:10px;color:#64748B;letter-spacing:.05em}
.btn{padding:5px 9px;border-radius:7px;border:1.5px solid #E2E8F0;background:#fff;font-size:11px;font-weight:700;cursor:pointer;color:#64748B}
.btn.on{border-color:#F59E0B;background:#FFFBEB;color:#D97706}
.btn.active{border-color:#2563EB;background:#EFF6FF;color:#2563EB}
/* TABS */
.tabs{height:54px;background:#fff;border-top:1px solid #E2E8F0;display:flex;flex-shrink:0}
.tab{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:#94A3B8;cursor:pointer;font-family:inherit}
.tab.active{color:#0F172A}
.tab-icon{font-size:20px;line-height:1}
/* SCROLL */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* INSTRUMENT BAR */
.ibar{background:#fff;border-bottom:1px solid #E2E8F0}
.grp{padding:5px 14px 2px;font-size:9px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.1em}
.pills{display:flex;gap:6px;padding:3px 14px 8px;overflow-x:auto}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;min-width:64px;padding:6px 10px;border-radius:8px;border:1.5px solid #E2E8F0;background:#fff;cursor:pointer;text-align:center}
.pill.sel{border-width:2px}
.pn{font-size:11px;font-weight:700}
.pc{font-size:10px;font-weight:700;margin-top:2px}
/* MAIN VIEW */
.view{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;color:#CBD5E1;gap:10px}
.empty-i{font-size:40px}
.empty-t{font-size:13px;text-align:center;line-height:1.6}
/* CARDS */
.card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:12px 14px}
.clbl{font-size:9px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
/* BADGE */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.ptag{display:inline-block;padding:2px 7px;border-radius:5px;background:#EFF6FF;color:#2563EB;font-size:10px;font-weight:700}
/* PRICE CARD */
.pc-card{padding:10px 12px;border-radius:9px}
.pc-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;color:#64748B}
.pc-val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pc-unit{font-size:10px;color:#94A3B8;margin-left:3px;font-weight:400}
/* CONF BAR */
.cb{display:flex;align-items:center;gap:8px}
.cb-track{flex:1;height:5px;background:#F1F5F9;border-radius:4px;overflow:hidden}
.cb-fill{height:100%;border-radius:4px;transition:width 1s}
.cb-pct{font-size:12px;font-weight:700;min-width:34px;font-variant-numeric:tabular-nums}
/* STATUS */
.sbar{display:flex;align-items:center;gap:7px;padding:8px 12px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;flex-wrap:wrap}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.stxt{font-size:10px;font-weight:600;color:#475569;flex:1}
.sbtn{padding:3px 9px;border-radius:5px;border:1.5px solid #E2E8F0;background:#fff;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
/* SUBTABS */
.stabs{display:flex;background:#F1F5F9;border-radius:7px;padding:2px;width:fit-content}
.stab{padding:5px 13px;border-radius:6px;border:none;font-size:11px;cursor:pointer;background:transparent;color:#94A3B8;font-family:inherit;font-weight:500}
.stab.active{background:#fff;color:#0F172A;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* INDICATORS */
.ind{padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #E2E8F0}
.ind-n{font-size:9px;color:#94A3B8;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.ind-v{font-size:11px;font-weight:700;margin-bottom:2px}
.ind-i{font-size:9px;color:#64748B;line-height:1.3}
/* TRADE CARD */
.tc{border-radius:10px;overflow:hidden;border:1px solid #E2E8F0;background:#fff}
.tc-hdr{padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.tc-dir{font-size:11px;font-weight:800;letter-spacing:.06em}
.tc-sty{padding:2px 7px;border-radius:999px;border:1px solid #E2E8F0;font-size:9px;font-weight:700;color:#64748B}
.tc-lvls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:9px 12px}
.lv-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.lv-v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.lv-s{font-size:10px;color:#94A3B8;font-variant-numeric:tabular-nums}
.ctx{display:flex;gap:5px;flex-wrap:wrap;padding:0 12px 8px}
.ctx-t{padding:3px 7px;border-radius:5px;background:#F8FAFC;border:1px solid #E2E8F0;font-size:9px;color:#475569}
.tnote{padding:0 12px 9px;font-size:10px;color:#64748B;font-style:italic;line-height:1.4}
/* HISTORY */
.hr{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.hp{font-size:9px;color:#94A3B8;min-width:22px}
.hbar{flex:1;height:3px;background:#F1F5F9;border-radius:2px;overflow:hidden}
.hfill{height:100%;border-radius:2px}
.ht{font-size:9px;color:#94A3B8}
.rbox{margin-top:7px;padding:7px 10px;border-radius:6px;background:#EFF6FF;border:1px solid #BFDBFE;font-size:10px;color:#334155;line-height:1.5}
.rl{font-weight:700;color:#2563EB;margin-right:4px}
/* WARN */
.warn{padding:8px 11px;border-radius:8px;background:#FFFBEB;border:1px solid #FDE68A;display:flex;gap:6px;font-size:10px;color:#92400E;line-height:1.5}
/* SKEL */
.sk{border-radius:8px;background:linear-gradient(90deg,#F1F5F9 25%,#E2E8F0 50%,#F1F5F9 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
/* LIST */
.li{display:flex;gap:5px;font-size:11px;color:#334155;line-height:1.5;margin-bottom:4px}
/* CHAT */
.chat{display:flex;flex-direction:column;height:100%}
.cmsgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.mu{align-self:flex-end;background:#0F172A;color:#fff;padding:8px 12px;border-radius:14px 14px 3px 14px;font-size:12px;max-width:85%;line-height:1.5}
.ma{align-self:flex-start;background:#fff;border:1px solid #E2E8F0;color:#334155;padding:8px 12px;border-radius:14px 14px 14px 3px;font-size:12px;max-width:85%;line-height:1.5}
.ma-l{font-size:9px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.qr{display:flex;gap:5px;flex-wrap:wrap;padding:6px 14px}
.qb{padding:4px 9px;border-radius:999px;border:1px solid #E2E8F0;background:#fff;font-size:10px;color:#475569;cursor:pointer;font-family:inherit}
.ci-row{display:flex;gap:6px;padding:6px 10px 10px;border-top:1px solid #E2E8F0}
.ci{flex:1;padding:9px 12px;border-radius:8px;border:1.5px solid #E2E8F0;font-size:13px;outline:none;font-family:inherit;background:#F8FAFC}
.cs{padding:9px 14px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:#0F172A;color:#fff}
/* WIDGET */
.wgt{position:fixed;bottom:68px;right:10px;width:224px;background:rgba(8,12,22,.96);border-radius:14px;border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:50;display:none;animation:su .2s ease}
.wgt.show{display:block}
.wbar{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center}
.wt{font-size:9px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.1em}
.wc{background:none;border:none;color:rgba(255,255,255,.4);font-size:13px;cursor:pointer;line-height:1}
.wp{padding:9px 12px}
.wp+.wp{border-top:1px solid rgba(255,255,255,.06)}
.wph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ws{font-size:11px;font-weight:700;color:#fff}
.wp2{font-size:9px;color:rgba(255,255,255,.35)}
.wsig{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px}
.wg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.wcl{font-size:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:2px}
.wcv{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.wcs{font-size:9px;font-variant-numeric:tabular-nums}
.wmt{font-size:10px;color:rgba(255,255,255,.28);text-align:center;padding:7px 0}
.wsel-r{display:flex;padding:6px 12px 10px;border-top:1px solid rgba(255,255,255,.06)}
.wsel{flex:1;padding:5px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);font-size:10px;font-family:inherit}
/* TOASTS */
.toasts{position:fixed;top:62px;right:10px;z-index:100;display:flex;flex-direction:column;gap:6px;max-width:calc(100vw - 20px)}
.toast{padding:10px 12px;border-radius:10px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.18);display:flex;gap:8px;align-items:flex-start;max-width:300px;animation:si .25s ease}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.ttl{font-weight:700;font-size:11px;margin-bottom:2px}
.tbdy{font-size:10px;color:#475569;line-height:1.4}
.ttm{font-size:9px;color:#94A3B8;margin-top:2px}
.tx{background:none;border:none;color:#94A3B8;cursor:pointer;font-size:11px;flex-shrink:0}
/* DOTS LOADER */
.dots{display:flex;gap:4px;padding:8px 12px}
.dot{width:6px;height:6px;border-radius:50%;background:#CBD5E1;animation:b .9s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes ping{0%{transform:scale(1)}75%{transform:scale(2);opacity:0}100%{opacity:0}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes si{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
@keyframes su{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes b{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
</style>
</head>
<body>
<div id="app">
  <div class="nav">
    <div class="logo">
      <div class="logo-box">◈</div>
      <div class="logo-txt">TradeSim <span>AI</span></div>
    </div>
    <div class="nav-r">
      <div class="ldot"></div>
      <span class="lbl">LIVE</span>
      <button class="btn" id="nbtn" onclick="toggleNotif()">🔔 OFF</button>
      <button class="btn" id="wbtn" onclick="toggleWidget()">⊞</button>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <div class="wgt" id="wgt">
    <div class="wbar">
      <span class="wt">◈ TRADESIM WIDGET</span>
      <button class="wc" onclick="toggleWidget()">✕</button>
    </div>
    <div id="wp0" class="wp"><div class="wmt">Select a pair in the app</div></div>
    <div id="wp1" class="wp"><div class="wmt">Slot 2 — pick below</div></div>
    <div class="wsel-r">
      <select class="wsel" id="wsel2" onchange="onW2Change(this.value)">
        <option value="">Slot 2 pair…</option>
      </select>
    </div>
  </div>

  <div class="ibar" id="ibar"></div>

  <div class="scroll" id="scroll">
    <div id="aview"></div>
    <div id="cview" style="display:none"></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="t1" onclick="goTab('a')">
      <span class="tab-icon">📊</span><span>Analysis</span>
    </button>
    <button class="tab" id="t2" onclick="goTab('c')">
      <span class="tab-icon">💬</span><span>Ask AI</span>
    </button>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────
var INSTS = [
  {id:'gold',  n:'Gold',    sym:'XAU/USD',u:'oz',   p:2341.50, c:+0.82,col:'#B8960C',bg:'#FEFCE8'},
  {id:'silver',n:'Silver',  sym:'XAG/USD',u:'oz',   p:29.84,   c:-0.34,col:'#6B7280',bg:'#F9FAFB'},
  {id:'copper',n:'Copper',  sym:'HG1',    u:'lb',   p:4.523,   c:+1.21,col:'#B45309',bg:'#FFFBEB'},
  {id:'wti',   n:'WTI',     sym:'CL1',    u:'bbl',  p:78.42,   c:-0.67,col:'#1D4ED8',bg:'#EFF6FF'},
  {id:'brent', n:'Brent',   sym:'BRENT',  u:'bbl',  p:82.17,   c:-0.51,col:'#2563EB',bg:'#EFF6FF'},
  {id:'natgas',n:'Nat Gas', sym:'NG1',    u:'MMBtu',p:2.184,   c:+2.14,col:'#059669',bg:'#ECFDF5'},
  {id:'us30',  n:'US 30',   sym:'DJIA',   u:'pts',  p:39127.80,c:+0.43,col:'#7C3AED',bg:'#F5F3FF'},
  {id:'spx',   n:'S&P 500', sym:'SPX',    u:'pts',  p:5248.49, c:+0.57,col:'#0E7490',bg:'#ECFEFF'}
];
var GROUPS=[{l:'Metals',ids:['gold','silver','copper']},{l:'Energy',ids:['wti','brent','natgas']},{l:'Indices',ids:['us30','spx']}];
var TFS=['1H','4H','1D','1W'],IND={rsi:'RSI(14)',macd:'MACD',bb:'B.Bands',ema:'EMA X',vol:'Vol',obv:'OBV'};
var REFRESH=90000,MAXH=8;

// ── STATE ─────────────────────────────────────────────────────────────────
var S={sel:null,tf:'1D',tab:'a',sub:'o',nOn:false,wShow:false,w2:null,
       store:{},tim:{},toasts:[],loading:false,showH:false,
       chatH:[],chatM:[],chatL:false,tid:0};

// ── HELPERS ───────────────────────────────────────────────────────────────
function gi(id){return INSTS.find(function(x){return x.id===id;})||null;}
function fT(ts){return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function sC(s){if(!s)return'#94A3B8';if(s.indexOf('BUY')>=0)return'#16A34A';if(s.indexOf('SELL')>=0)return'#DC2626';return'#D97706';}
function sB(s){if(!s)return'#F1F5F9';if(s.indexOf('BUY')>=0)return'#DCFCE7';if(s.indexOf('SELL')>=0)return'#FFE4E6';return'#FEF9C3';}
function sT(s){if(!s)return'#64748B';if(s.indexOf('BUY')>=0)return'#15803D';if(s.indexOf('SELL')>=0)return'#B91C1C';return'#A16207';}
function sL(s){return{STRONG_BUY:'Strong Buy',BUY:'Buy',HOLD:'Hold',SELL:'Sell',STRONG_SELL:'Strong Sell'}[s]||s||'—';}
function fP(v,u){
  if(v===undefined||v===null)return'—';
  var n=+v;
  if(u==='pts')return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  if(n<10)return n.toFixed(4);
  return n.toFixed(2);
}
function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}
function gk(){return S.sel?S.sel+'-'+S.tf:null;}

// ── API ───────────────────────────────────────────────────────────────────
function callAPI(ins,tf,prev){
  var hasPrev=prev.length>0;
  var pc=hasPrev?'\n\nPREVIOUS PASSES ('+prev.length+'):\n'+prev.map(function(a,i){return'Pass '+(i+1)+': '+a.signal+' conf='+a.confidence+'%\n'+a.summary;}).join('\n---\n')+'\n\nRefine analysis. Adjust signal/confidence/targets if warranted. Explain change in refinementNote.':'';
  var p='Expert trading analyst AI. Continuous self-improving analysis.\nInstrument: '+ins.n+' ('+ins.sym+') | Timeframe: '+tf+' | Price: ~'+ins.p+' '+ins.u+' | Pass: '+(prev.length+1)+pc+'\n\nReturn ONLY valid compact JSON, absolutely no markdown or extra text:\n{"signal":"STRONG_BUY"|"BUY"|"HOLD"|"SELL"|"STRONG_SELL","confidence":<50-97>,"priceTarget":<number>,"stopLoss":<number>,"summary":"<2 sentences>","refinementNote":"'+(hasPrev?'<what changed>':'Initial pass.')+'","catalysts":["<c1>","<c2>","<c3>"],"risks":["<r1>","<r2>"],"indicators":{"rsi":{"value":<0-100>,"interpretation":"<text>"},"macd":{"value":"<text>","interpretation":"<text>"},"bb":{"value":"<text>","interpretation":"<text>"},"ema":{"value":"<text>","interpretation":"<text>"},"vol":{"value":"<text>","interpretation":"<text>"},"obv":{"value":"<text>","interpretation":"<text>"}},"dayTrades":[{"style":"Scalp"|"Day Trade"|"Momentum","direction":"LONG"|"SHORT","entryLow":<number>,"entryHigh":<number>,"stopLoss":<number>,"tp1":<number>,"tp2":<number>,"riskReward":<number>,"volumeContext":"<text>","volatilityContext":"<text>","timingContext":"<text>","note":"<1 sentence>"}]}\nProvide 2-3 dayTrades. Entry near current price.';
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,messages:[{role:'user',content:p}]})
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    var txt=(d.content||[]).map(function(b){return b.text||'';}).join('');
    var clean=txt.replace(/```json[\s\S]*?```|```[\s\S]*?```/g,function(m){return m.replace(/```json|```/g,'');}).trim();
    var parsed=JSON.parse(clean);
    parsed.timestamp=Date.now();parsed.pass=prev.length+1;
    return parsed;
  });
}

// ── LOOP ──────────────────────────────────────────────────────────────────
function runPass(key){
  if(!key||!S.sel)return Promise.resolve();
  var ins=gi(S.sel);if(!ins)return Promise.resolve();
  if(!S.store[key])S.store[key]={current:null,history:[],prevSig:null};
  var st=S.store[key];
  S.loading=true;rAnalysis();
  return callAPI(ins,S.tf,st.history).then(function(result){
    var nh=st.history.concat([result]).slice(-MAXH);
    var old=st.prevSig;
    st.current=result;st.history=nh;st.prevSig=result.signal;
    if(old!==null&&old!==result.signal){
      toast(ins.n+' signal changed',sL(old)+' → '+sL(result.signal)+' · '+result.confidence+'%',sC(result.signal));
    } else if(old===null){
      toast(ins.n+' ready',sL(result.signal)+' · '+result.confidence+'% · Pass '+result.pass,sC(result.signal));
    }
    wPair(0);
  }).catch(function(e){
    console.error('API error:',e);
  }).then(function(){
    S.loading=false;rAnalysis();
  });
}

function startLoop(key){
  stopLoop(key);
  if(!S.tim[key])S.tim[key]={};
  var t=S.tim[key];t.cd=REFRESH/1000;t.status='running';
  if(!S.store[key]||!S.store[key].current)runPass(key);
  t.iv=setInterval(function(){if(gk()===key)runPass(key);},REFRESH);
  t.cdiv=setInterval(function(){t.cd=t.cd<=1?REFRESH/1000:t.cd-1;rSbar();},1000);
}
function stopLoop(key){if(!S.tim[key])return;clearInterval(S.tim[key].iv);clearInterval(S.tim[key].cdiv);S.tim[key]={};}
function pauseLoop(key){if(!S.tim[key])return;clearInterval(S.tim[key].iv);clearInterval(S.tim[key].cdiv);S.tim[key].status='paused';rSbar();}

// ── TOASTS ────────────────────────────────────────────────────────────────
function toast(title,body,color){
  if(!S.nOn)return;
  var id=++S.tid,ts=Date.now();
  S.toasts.push({id:id,title:title,body:body,color:color,ts:ts});
  rToasts();
  setTimeout(function(){dismissToast(id);},7000);
}
function dismissToast(id){S.toasts=S.toasts.filter(function(t){return t.id!==id;});rToasts();}
function rToasts(){
  var el=document.getElementById('toasts');if(!el)return;
  el.innerHTML=S.toasts.map(function(t){
    return '<div class="toast" style="border:1.5px solid '+t.color+'33">'+
      '<div class="tdot" style="background:'+t.color+'"></div>'+
      '<div style="flex:1"><div class="ttl">'+esc(t.title)+'</div>'+
      '<div class="tbdy">'+esc(t.body)+'</div>'+
      '<div class="ttm">'+fT(t.ts)+'</div></div>'+
      '<button class="tx" onclick="dismissToast('+t.id+')">✕</button></div>';
  }).join('');
}

// ── WIDGET PAIR RENDER ────────────────────────────────────────────────────
function wPair(idx){
  var pid=idx===0?S.sel:S.w2;
  var ins=pid?gi(pid):null;
  var key=ins?ins.id+'-'+S.tf:null;
  var a=key&&S.store[key]?S.store[key].current:null;
  var el=document.getElementById('wp'+idx);if(!el)return;
  if(!ins){el.innerHTML='<div class="wmt">'+(idx===0?'Select a pair in the app':'Pick pair in selector')+'</div>';return;}
  var tr=a&&a.dayTrades&&a.dayTrades[0]?a.dayTrades[0]:null;
  var sig=a?a.signal:null;
  var sigBg=sig?(sig.indexOf('BUY')>=0?'rgba(74,222,128,.2)':sig.indexOf('SELL')>=0?'rgba(248,113,113,.2)':'rgba(252,211,77,.2)'):'';
  var sigFg=sig?(sig.indexOf('BUY')>=0?'#4ADE80':sig.indexOf('SELL')>=0?'#F87171':'#FCD34D'):'rgba(255,255,255,.4)';
  el.innerHTML=
    '<div class="wph">'+
      '<div><div class="ws">'+esc(ins.sym)+'</div><div class="wp2">'+fP(ins.p,ins.u)+' '+ins.u+'</div></div>'+
      (sig?'<span class="wsig" style="background:'+sigBg+';color:'+sigFg+'">'+sL(sig)+'</span>':'')+
    '</div>'+
    (tr?
      '<div class="wg">'+
        '<div><div class="wcl" style="color:rgba(255,255,255,.38)">ENTRY</div><div class="wcv" style="color:#fff">'+fP(tr.entryLow,ins.u)+'</div><div class="wcs" style="color:rgba(255,255,255,.3)">–'+fP(tr.entryHigh,ins.u)+'</div></div>'+
        '<div><div class="wcl" style="color:rgba(248,113,113,.75)">SL</div><div class="wcv" style="color:#F87171">'+fP(tr.stopLoss,ins.u)+'</div><div class="wcs" style="color:rgba(255,255,255,.3)">R:R '+tr.riskReward+'</div></div>'+
        '<div><div class="wcl" style="color:rgba(74,222,128,.75)">TP1/2</div><div class="wcv" style="color:#4ADE80">'+fP(tr.tp1,ins.u)+'</div><div class="wcs" style="color:#86EFAC">'+fP(tr.tp2,ins.u)+'</div></div>'+
      '</div>'
    :'<div class="wmt">'+(a?'No setup yet':'Analysing…')+'</div>');
}

// ── IBAR ──────────────────────────────────────────────────────────────────
function rIbar(){
  var el=document.getElementById('ibar');if(!el)return;
  el.innerHTML=GROUPS.map(function(g){
    return '<div class="grp">'+g.l+'</div><div class="pills">'+
      INSTS.filter(function(c){return g.ids.indexOf(c.id)>=0;}).map(function(c){
        var up=c.c>=0,sel=S.sel===c.id;
        return '<div class="pill'+(sel?' sel':'')+'" style="border-color:'+(sel?c.col:'#E2E8F0')+';background:'+(sel?c.bg:'#fff')+'" onclick="selI(\''+c.id+'\')">'+
          '<div class="pn">'+esc(c.n)+'</div>'+
          '<div class="pc" style="color:'+(up?'#16A34A':'#DC2626')+'">'+(up?'▲':'▼')+Math.abs(c.c).toFixed(2)+'%</div>'+
        '</div>';
      }).join('')+'</div>';
  }).join('');
}

// ── STATUS BAR ────────────────────────────────────────────────────────────
function rSbar(){
  var el=document.getElementById('sbar');if(!el)return;
  var key=gk(),t=key?S.tim[key]:null;
  var status=t&&t.status?t.status:'idle',cd=t&&t.cd?t.cd:0;
  var dc=status==='running'?'#22C55E':status==='paused'?'#F59E0B':'#94A3B8';
  var da=status==='running'?'animation:pulse 2s infinite':'';
  var hl=key&&S.store[key]?S.store[key].history.length:0;
  el.innerHTML=
    '<div class="sdot" style="background:'+dc+';'+da+'"></div>'+
    '<span class="stxt">'+(status==='running'?'LIVE · '+cd+'s':status==='paused'?'PAUSED':'IDLE')+(S.loading?' · analysing…':'')+'</span>'+
    '<button class="sbtn" onclick="forceR()">↻</button>'+
    (status==='running'?
      '<button class="sbtn" style="color:#D97706" onclick="doPause()">⏸</button>':
      '<button class="sbtn" style="color:#16A34A;border-color:#DCFCE7;background:#F0FDF4" onclick="doResume()">▶</button>')+
    '<button class="sbtn" style="'+(S.showH?'color:#4338CA;border-color:#C7D2FE;background:#EEF2FF':'')+'" onclick="togH()">📜'+hl+'</button>';
}

// ── ANALYSIS VIEW ─────────────────────────────────────────────────────────
function rAnalysis(){
  var v=document.getElementById('aview');if(!v)return;
  var ins=gi(S.sel),key=gk();
  var st=key?S.store[key]:null,cur=st?st.current:null,hist=st?st.history:[];
  if(!ins){
    v.innerHTML='<div class="empty"><div class="empty-i">◈</div><div class="empty-t">Select an instrument above<br>to start AI analysis</div></div>';
    return;
  }
  var ac=cur?sC(cur.signal):'#94A3B8';
  var h='<div class="view">';
  // Header
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px">'+
    '<div>'+
      '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'+
        '<span style="font-size:20px;font-weight:700">'+esc(ins.n)+'</span>'+
        (cur?'<span class="badge" style="background:'+sB(cur.signal)+';color:'+sT(cur.signal)+'">'+sL(cur.signal)+'</span>':'')+
        (cur?'<span class="ptag">pass '+cur.pass+'</span>':'')+
      '</div>'+
      '<div style="font-size:10px;color:#94A3B8;margin-top:3px">'+esc(ins.sym)+' · '+fP(ins.p,ins.u)+' /'+ins.u+'</div>'+
    '</div>'+
    '<div style="display:flex;gap:4px;flex-wrap:wrap">'+
      TFS.map(function(t){
        return '<button onclick="selTf(\''+t+'\')" style="padding:4px 9px;border-radius:6px;border:1.5px solid '+(t===S.tf?ins.col:'#E2E8F0')+';background:'+(t===S.tf?ins.bg:'#fff')+';color:'+(t===S.tf?ins.col:'#64748B')+';font-size:10px;font-weight:700;cursor:pointer">'+t+'</button>';
      }).join('')+
    '</div>'+
  '</div>';
  // Status bar
  h+='<div id="sbar" class="sbar"></div>';
  // History
  if(S.showH&&hist.length>0){
    h+='<div class="card"><div class="clbl">Signal Evolution</div>';
    hist.forEach(function(hh){
      h+='<div class="hr"><span class="hp">#'+hh.pass+'</span>'+
        '<span class="badge" style="font-size:9px;padding:2px 7px;background:'+sB(hh.signal)+';color:'+sT(hh.signal)+'">'+sL(hh.signal)+'</span>'+
        '<div class="hbar"><div class="hfill" style="width:'+hh.confidence+'%;background:'+sC(hh.signal)+'"></div></div>'+
        '<span class="ht">'+fT(hh.timestamp)+'</span></div>';
    });
    if(hist.length>1&&cur&&cur.refinementNote&&cur.refinementNote!=='Initial pass.'){
      h+='<div class="rbox"><span class="rl">Refinement:</span>'+esc(cur.refinementNote)+'</div>';
    }
    h+='</div>';
  }
  // Skeleton
  if(S.loading&&!cur){
    [5,3,6,3].forEach(function(hh,i){h+='<div class="sk" style="height:'+hh+'rem;animation-delay:'+(i*.1)+'s"></div>';});
  }
  // Sub tabs
  if(cur){
    h+='<div class="stabs">'+
      '<button class="stab'+(S.sub==='o'?' active':'')+'" onclick="setSub(\'o\')">📈 Overview</button>'+
      '<button class="stab'+(S.sub==='s'?' active':'')+'" onclick="setSub(\'s\')">⚡ Day Trading</button>'+
    '</div>';
    if(S.sub==='o'){
      h+='<div class="g2">'+
        '<div class="pc-card" style="background:#F0FDF4;border:1px solid #BBF7D0"><div class="pc-lbl" style="color:#15803D">Swing Target</div><div class="pc-val" style="color:#15803D">'+fP(cur.priceTarget,ins.u)+'<span class="pc-unit">/'+ins.u+'</span></div></div>'+
        '<div class="pc-card" style="background:#FFF1F2;border:1px solid #FECDD3"><div class="pc-lbl" style="color:#B91C1C">Swing Stop</div><div class="pc-val" style="color:#B91C1C">'+fP(cur.stopLoss,ins.u)+'<span class="pc-unit">/'+ins.u+'</span></div></div>'+
      '</div>';
      h+='<div class="card"><div class="clbl">AI Confidence — pass '+cur.pass+'</div>'+
        '<div class="cb"><div class="cb-track"><div class="cb-fill" style="width:'+cur.confidence+'%;background:linear-gradient(90deg,'+ac+'88,'+ac+')"></div></div>'+
        '<span class="cb-pct" style="color:'+ac+'">'+cur.confidence+'%</span></div></div>';
      h+='<div class="card"><div class="clbl">Market Outlook</div><p style="font-size:12px;color:#334155;line-height:1.6">'+esc(cur.summary)+'</p></div>';
      h+='<div><div class="clbl" style="margin-bottom:6px">Technical Indicators</div><div class="g3">';
      Object.keys(cur.indicators||{}).forEach(function(k){
        var ind=cur.indicators[k];
        h+='<div class="ind"><div class="ind-n">'+(IND[k]||k)+'</div>'+
          '<div class="ind-v">'+(typeof ind.value==='number'?ind.value.toFixed(1):esc(ind.value))+'</div>'+
          '<div class="ind-i">'+esc(ind.interpretation)+'</div></div>';
      });
      h+='</div></div>';
      h+='<div class="g2">'+
        '<div class="card"><div class="clbl">Catalysts</div>'+(cur.catalysts||[]).map(function(c){return'<div class="li"><span style="color:#16A34A;font-size:13px">·</span>'+esc(c)+'</div>';}).join('')+'</div>'+
        '<div class="card"><div class="clbl">Risks</div>'+(cur.risks||[]).map(function(r){return'<div class="li"><span style="color:#DC2626;font-size:13px">·</span>'+esc(r)+'</div>';}).join('')+'</div>'+
      '</div>';
    }
    if(S.sub==='s'){
      h+='<div class="warn"><span style="font-size:14px;flex-shrink:0">⚠️</span><span>AI-generated setups for informational purposes only. Not financial advice.</span></div>';
      if(cur.dayTrades&&cur.dayTrades.length>0){
        cur.dayTrades.forEach(function(tr){
          var isL=tr.direction==='LONG';
          h+='<div class="tc">'+
            '<div class="tc-hdr" style="background:'+(isL?'#F0FDF4':'#FFF1F2')+'">'+
              '<div style="display:flex;align-items:center;gap:6px">'+
                '<span class="tc-dir" style="color:'+(isL?'#16A34A':'#DC2626')+'">'+(isL?'▲ LONG':'▼ SHORT')+'</span>'+
                '<span class="tc-sty">'+esc(tr.style)+'</span>'+
              '</div>'+
              '<div style="display:flex;align-items:center;gap:4px"><span style="font-size:9px;color:#64748B">R:R</span>'+
              '<span style="font-size:11px;font-weight:700;color:'+(isL?'#16A34A':'#DC2626')+'">'+tr.riskReward+'</span></div>'+
            '</div>'+
            '<div class="tc-lvls">'+
              '<div><div class="lv-l" style="color:#64748B">Entry</div><div class="lv-v">'+fP(tr.entryLow,ins.u)+'</div><div class="lv-s">–'+fP(tr.entryHigh,ins.u)+'</div></div>'+
              '<div><div class="lv-l" style="color:#DC2626">Stop Loss</div><div class="lv-v" style="color:#DC2626">'+fP(tr.stopLoss,ins.u)+'</div><div class="lv-s">'+ins.u+'</div></div>'+
              '<div><div class="lv-l" style="color:#16A34A">TP1/TP2</div><div class="lv-v" style="color:#16A34A">'+fP(tr.tp1,ins.u)+'</div><div class="lv-s" style="color:#059669">'+fP(tr.tp2,ins.u)+'</div></div>'+
            '</div>'+
            '<div class="ctx">'+
              (tr.volumeContext?'<span class="ctx-t">📊 '+esc(tr.volumeContext)+'</span>':'')+
              (tr.volatilityContext?'<span class="ctx-t">⚡ '+esc(tr.volatilityContext)+'</span>':'')+
              (tr.timingContext?'<span class="ctx-t">🕐 '+esc(tr.timingContext)+'</span>':'')+
            '</div>'+
            (tr.note?'<div class="tnote">'+esc(tr.note)+'</div>':'')+
          '</div>';
        });
      } else {
        h+='<div style="text-align:center;padding:24px;color:#94A3B8;font-size:12px">No setups in this pass.</div>';
      }
    }
  }
  h+='</div>';
  v.innerHTML=h;
  rSbar();
}

// ── CHAT VIEW ─────────────────────────────────────────────────────────────
function rChat(){
  var v=document.getElementById('cview');if(!v)return;
  var ins=gi(S.sel);
  var Q=ins?['Best entry for '+ins.n+'?','Session timing?','Stop width?','Scalp or swing?']:['Best instrument?','Volatility tips?','Session guide?','Risk basics?'];
  v.innerHTML=
    '<div class="chat" style="height:calc(100vh - 108px - 54px)">'+
    '<div class="cmsgs" id="cmsgs">'+
      S.chatM.map(function(m){
        return m.role==='user'?
          '<div class="mu">'+esc(m.text)+'</div>':
          '<div class="ma"><div class="ma-l">AI Analyst</div>'+esc(m.text)+'</div>';
      }).join('')+
      (S.chatL?'<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>':'')+
    '</div>'+
    '<div class="qr">'+Q.map(function(q){return'<button class="qb" onclick="setCI('+JSON.stringify(q)+')">'+esc(q)+'</button>';}).join('')+'</div>'+
    '<div class="ci-row"><input class="ci" id="ci" placeholder="Ask the AI analyst…" onkeydown="if(event.key===\'Enter\')sendC()"><button class="cs" onclick="sendC()">Send</button></div>'+
    '</div>';
  setTimeout(function(){var m=document.getElementById('cmsgs');if(m)m.scrollTop=m.scrollHeight;},50);
}
function setCI(t){var e=document.getElementById('ci');if(e){e.value=t;e.focus();}}
function sendC(){
  var e=document.getElementById('ci');
  var txt=e?e.value.trim():'';
  if(!txt||S.chatL)return;
  e.value='';
  var ins=gi(S.sel);
  S.chatM.push({role:'user',text:txt});
  S.chatH.push({role:'user',content:txt});
  S.chatL=true;rChat();
  var sys=ins?'Expert trader. '+ins.n+' ('+ins.sym+', ~'+ins.p+' '+ins.u+'). Concise, actionable. Max 3 sentences.':'Expert commodity and index trader. Concise. Max 3 sentences.';
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,system:sys,messages:S.chatH})
  }).then(function(r){return r.json();}).then(function(d){
    var t=(d.content||[]).map(function(b){return b.text||'';}).join('')||'No response.';
    S.chatH.push({role:'assistant',content:t});
    S.chatM.push({role:'ai',text:t});
  }).catch(function(){
    S.chatM.push({role:'ai',text:'Connection error. Please try again.'});
  }).then(function(){S.chatL=false;rChat();});
}

// ── ACTIONS ───────────────────────────────────────────────────────────────
function selI(id){
  if(S.sel===id)return;
  S.sel=id;S.showH=false;
  rIbar();rAnalysis();
  var k=gk();if(k)startLoop(k);
  wPair(0);
}
function selTf(tf){
  if(S.tf===tf)return;
  var ok=gk();if(ok)pauseLoop(ok);
  S.tf=tf;rAnalysis();
  var k=gk();if(k)startLoop(k);
}
function forceR(){var k=gk();if(k&&!S.loading)runPass(k);}
function doPause(){var k=gk();if(k)pauseLoop(k);}
function doResume(){var k=gk();if(k)startLoop(k);}
function togH(){S.showH=!S.showH;rAnalysis();}
function setSub(t){S.sub=t;rAnalysis();}
function goTab(tab){
  S.tab=tab;
  document.getElementById('aview').style.display=tab==='a'?'':'none';
  document.getElementById('cview').style.display=tab==='c'?'':'none';
  document.getElementById('scroll').style.overflow=tab==='a'?'auto':'hidden';
  document.getElementById('t1').className='tab'+(tab==='a'?' active':'');
  document.getElementById('t2').className='tab'+(tab==='c'?' active':'');
  if(tab==='a'){rAnalysis();}
  else{
    if(!S.chatM.length){
      var ins=gi(S.sel);
      S.chatM=[{role:'ai',text:ins?'Analysis running for '+ins.n+'. Ask about entries, sessions, or risk.':'Select an instrument or ask a general trading question.'}];
    }
    rChat();
  }
}
function toggleNotif(){
  S.nOn=!S.nOn;
  var b=document.getElementById('nbtn');
  b.textContent='🔔 '+(S.nOn?'ON':'OFF');
  b.className='btn'+(S.nOn?' on':'');
}
function toggleWidget(){
  S.wShow=!S.wShow;
  document.getElementById('wgt').classList.toggle('show',S.wShow);
  document.getElementById('wbtn').className='btn'+(S.wShow?' active':'');
  if(S.wShow){wPair(0);wPair(1);}
}
function onW2Change(v){
  S.w2=v||null;
  if(S.w2){
    var k2=S.w2+'-'+S.tf;
    if(!S.store[k2]||!S.store[k2].current){
      var i2=gi(S.w2);
      if(i2){
        S.store[k2]={current:null,history:[],prevSig:null};
        callAPI(i2,S.tf,[]).then(function(r){S.store[k2].current=r;wPair(1);}).catch(function(){});
      }
    }
  }
  wPair(1);
}

// ── INIT ──────────────────────────────────────────────────────────────────
// Populate widget slot 2 selector
var wsel2=document.getElementById('wsel2');
INSTS.forEach(function(c){
  var o=document.createElement('option');o.value=c.id;o.textContent=c.sym;wsel2.appendChild(o);
});

// Initial render
rIbar();
rAnalysis();

// Service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

// Install banner
var _dp;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();_dp=e;
  var b=document.createElement('div');
  b.style.cssText='position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 18px;border-radius:999px;font-size:12px;z-index:999;display:flex;gap:10px;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,.4);white-space:nowrap';
  b.innerHTML='<span>📲 Install TradeSim AI</span>'+
    '<button onclick="window._doInst()" style="padding:4px 12px;border-radius:999px;background:#2563EB;color:#fff;border:none;font-size:11px;font-weight:700;cursor:pointer">Install</button>'+
    '<button onclick="this.parentNode.remove()" style="background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:16px;line-height:1">✕</button>';
  document.body.appendChild(b);
  setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},15000);
});
window._doInst=function(){
  if(_dp){_dp.prompt();_dp.userChoice.then(function(){_dp=null;});}
};
</script>
